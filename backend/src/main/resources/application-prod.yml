spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/yonsei_shuttle?currentSchema=yonsei_shuttle&stringtype=unspecified
    username: ${DB_USERNAME:shuttle}
    password: ${DB_PASSWORD}    # ← fallback 제거 (없으면 시작 실패하게)

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}    # ← fallback 없음

logging:
  level:
    com.yonsei.shuttle: INFO
    root: WARN