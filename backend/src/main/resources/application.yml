spring:
  application:
    name: yonsei-shuttle

  profiles:
    active: dev

  datasource:
    # PostgreSQL Custom ENUM 타입을 String으로 주고받으려면 Hibernate에 "stringtype=unspecified" 옵션 필요
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yonsei_shuttle}?currentSchema=yonsei_shuttle&stringtype=unspecified
    username: ${DB_USERNAME:shuttle}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: yonsei_shuttle
        jdbc:
          lob:
            non_contextual_creation: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:please-change-this-secret-in-production-must-be-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs