services:
  # ...

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: yonsei-shuttle-backend
    container_name: yonsei-backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yonsei_shuttle?currentSchema=yonsei_shuttle&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-shuttle}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ...

  postgres:
    image: postgres:16
    container_name: yonsei-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-yonsei_shuttle}
      POSTGRES_USER: ${DB_USERNAME:-shuttle}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shuttle} -d ${DB_NAME:-yonsei_shuttle}"]
      interval: 5s
      retries: 5
    restart: unless-stopped